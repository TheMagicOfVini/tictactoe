version: '2'
services:
  web:
    build: .
    command: >
        bash -c "while true ;do wait ;done"
    volumes:
      - .:/app
      - bundle_path:/bundle
      - /app/frontend/node_modules
    ports:
      - "3000:3000" # frontend
      - "3001:3001" # backend
      - "8080:8080" # codeserver
    environment:
      - PASSWORD
      - CORS_ORIGINS
      - BUNDLE_PATH=/bundle/vendor
volumes:
  bundle_path:
